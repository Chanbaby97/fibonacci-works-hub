l kit — bag of soil, pots, shovel, gloves, seeds, starter trays/seedlings, seasonal calendar, soil quick card — before you get hands dirty."},{id:"knowledge",label:"The Knowledge",icon:"📋",image:"placeholders/ws01-knowledge.svg",content:"Talk through the core points while people work with soil and trays — not a lecture then a lab. Soil feel-test, finished compost, packet days-to-maturity (from seed or transplant), and cool crops that fit a short season. There is no one frost date for all of Unama'ki: Sydney-area published averages often fall in late May; highlands and inland sites differ; use the forecast. Fall care is a later card. Point to printouts and the QR."},{id:"activity",label:"Hands-On Activity",icon:"🪴",image:"placeholders/ws01-activity.svg",content:`Plant trays, run the soil feel-test, and use printouts/QR on your phone while we talk. No silent slideshow — hands stay busy the whole time. Hand out the seasonal planting chart and invite questions while hands are in the soil.

🧰 Materials needed (session):
• Bag of soil / potting mix
• Pots and starter trays (cell packs or small pots)
• Small shovel / trowel; gloves
• Seeds or young seedlings suited to Cape Breton
• Soil samples (sand / clay / loam) for feel test
• Watering can or spray bottle; labels & marker
• Printed seasonal planting calendar + soil quick card
• QR card for phone follow-along

🧰 Take-home kit (physical — what leaves with you):
• Bag of soil · pots · shovel · gloves · seeds
• Seedlings / starter tray · seasonal calendar · soil quick card · Certificate of Completion

💵 Rough cost (CAD, Cape Breton/local — confirm locally):
• Session materials per person: confirm locally (included in MSGAM session materials when booked)
• At-home DIY redo of one kit: confirm locally (item costs — confirm locally)

🏠 At-home redo guide:
1. Moisten the mix. Fill cells loosely — do not pack it rock-hard.
2. Sow at the depth printed on the packet, or set a seedling no deeper than it grew.
3. Label variety and date. Bright light. Water until moist, not puddled.
4. Harden off over several days: more outdoor time each day, then back in.
5. Tender crops go out only after the local forecast is past frost. Cool crops can go earlier.`},{id:"discussion",label:"Community Discussion",icon:"💬",image:"placeholders/ws01-discussion.svg",content:"Open floor while hands stay on trays if people want — neighbourly talk, not a lecture. What people have grown, what works in local yards, challenges, and how growing helps a household put food on the table. Printouts/QR stay available. Practical and plain — share what you know, no jargon."},{id:"takehome",label:"Take-Home",icon:"🎁",image:"placeholders/ws01-takehome.svg",content:`Every participant leaves with a physical kit: bag of soil, pots, shovel, gloves, seeds, seedlings/starter tray, a seasonal planting calendar for Cape Breton, a soil health quick reference card, and a Certificate of Completion. Care steps and redo guide on the printout / QR.

🏠 At-home redo (after class):
1. Start a second tray with the same four moves: fill, sow, label, water.
2. Water when the top feels dry; do not leave the tray sitting in water.
3. Check the forecast, not a single island frost date, before tender plants go out.
4. Later in the year: use the short fall winterizing card. Spring care stays the focus.
5. Share surplus seedlings with neighbours if you have extras.`},{id:"next",label:"What's Next",icon:"➡️",image:"placeholders/ws01-next.svg",content:"Workshop 02 — Building Raised Garden Beds — is a 5 Hour session. Participants build a complete raised garden bed from scratch and take it home planted with what they started today. Book through MSGAM. This is one of 14 workshops that run on repeat for new cohorts. Redo a tray at home before the next class so seedlings are ready for the bed. Printouts / QR stay available for booking info."}],keypoints:[{label:"Soil Health",detail:"Learn what your soil needs and how to build it naturally"},{label:"Seed Selection",detail:"Choose varieties that thrive in Cape Breton's unique climate"},{label:"Planting Schedule",detail:"Know exactly when to start seeds and when to plant outside"},{label:"Growing Techniques",detail:"Spacing, watering, sunlight — the fundamentals done right"},{label:"Frost Awareness",detail:"Read typical Cape Breton frost windows; use a short fall care card later"},{label:"Materials & Cost",detail:"Session kit: confirm locally; at-home DIY redo: confirm locally"},{label:"At-Home Redo",detail:"Refill a tray, sow or transplant, label, water evenly, follow your Cape Breton planting calendar"}]},{number:"02",stream:"Food Sovereignty & Gardening",title:"Building Raised Garden Beds",duration:"5 Hours",color:"#5a3e2b",accent:"#c4843a",dark:"#2d1f12",emoji:"🔨",about:"Hands-on construction workshop where participants build a raised garden bed from start to finish. Covers lumber selection, tool safety, bed assembly, soil layering, and planting.",sections:[{id:"welcome",label:"Welcome & Opening",icon:"🤝",image:"placeholders/ws02-welcome.svg",content:"This session is on Mi'kmaq territory in Unama'ki (Cape Breton). Short land acknowledgement: honour the territory; thank MSGAM hosts. Do not speak for Mi'kmaq people. Brief introductions and a clear session overview. This is hands-on-while-talking: printouts and a QR for phone follow-along sit on the table while you build. Preview today's physical kit — untreated lumber, fasteners, soil layers, supervised tools — before you lift a saw."},{id:"knowledge",label:"The Knowledge",icon:"📋",image:"placeholders/ws02-knowledge.svg",content:"Talk through the core points while people measure, cut, and assemble — not a lecture then a lab. Cover lumber selection (untreated for food beds), tool safety, bed dimensions you can reach, soil layering, and planting layout. Keep each point plain and practical. Point to printouts and the QR so people can follow on their phone while their hands stay busy."},{id:"activity",label:"Hands-On Activity",icon:"🪵",image:"placeholders/ws02-activity.svg",content:`• Learn while you build — hands stay busy
• Cut, fasten, assemble your bed; supervised tools
• Layer soil together; plant seeds or seedlings
• Use printouts + QR on your phone
• Your finished bed goes HOME planted

Redo path: after class, open Take-Home for numbered at-home steps — materials and costs below stay here for the DIY rebuild.

🧰 Materials needed (session):
• Untreated lumber cut to plan (cedar or spruce preferred for Cape Breton)
• Exterior screws / fasteners; corner brackets if used
• Measuring tape, square, saw, drill (shared/supervised)
• PPE — Eye and hearing protection; gloves for carrying lumber only — gloves off on any spinning saw or drill
• Plain cardboard weed barrier (no tape, no glossy ink); finished compost + topsoil — no fresh-branch fill
• Seeds or seedlings for first planting
• Printed soil mix guide + tool safety card
• QR card for phone follow-along

🧰 Take-home kit (physical — what leaves with you):
• Fully built, planted raised garden bed
• Soil mix & layering guide · tool safety quick card · Certificate of Completion
• (Shared tools stay with facilitator unless you own them)

💵 Rough cost (CAD, Cape Breton/local — confirm locally):
• Session materials per person: confirm locally for a small household bed (included in MSGAM session materials when booked)
• At-home DIY redo of one bed: confirm locally (item costs — confirm locally)

🏠 At-home redo guide:
1. Mark a width you can reach — about 1.2 m (4 ft) from both sides; narrower from one side. Level the ground.
2. Cut untreated lumber; assemble square corners; fasten securely.
3. On grass: plain cardboard only (no tape, no gloss). Add topsoil + finished compost; water to settle; top up to about 20–30 cm.
4. Plant with spacing from class; mulch edges if windy.
5. Follow tool-safety card — no rushing with saws or drills.`},{id:"discussion",label:"Community Discussion",icon:"💬",image:"placeholders/ws02-discussion.svg",content:`Open floor for community-specific questions:

• Write where your bed will sit, what you will grow first, and one lumber or scrap-wood source nearby.`},{id:"takehome",label:"Take-Home",icon:"🎁",image:"placeholders/ws02-takehome.svg",content:`Every participant leaves with a physical kit:

aceholders/ws03-knowledge.svg",content:"Talk through the core points while people fill worksheets — not a lecture then a lab. Order is keep, share, preserve safely, then sell only if that food's rules allow — check Public Health / market organizer first. Do not print sample prices — look up one live local price. Freezing and drying before canning. Canning rules live in Workshop 05. Food sovereignty is people deciding their food system; Indigenous food sovereignty is defined by Indigenous peoples — do not speak for Mi'kmaq. If money comes in, it may be taxable: awareness only, not tax advice. Point to printouts and the QR."},{id:"activity",label:"Hands-On Activity",icon:"📝",image:"placeholders/ws03-activity.svg",content:`Run cost-benefit, fill pricing worksheets, draft surplus plans, and map community buyers/traders while we talk — hands stay busy the whole time. Printouts/QR on phones. Low-cost kitchen-table redo later.

🏠 At-home redo guide:
1. Pick one crop you might actually grow.
2. List seed, soil, and water you pay. Note time — do not invent a wage.
3. Look up one price posted locally this week. Do not copy a number from this deck.
4. Split the harvest: keep / share / preserve / sell. Preserve means freeze, dry, or a tested canning card.
5. Sell only if that food's rules allow it — ask Public Health / the market organizer. If you are paid, it may be taxable — this is not tax advice.`},{id:"discussion",label:"Community Discussion",icon:"💬",image:"placeholders/ws03-discussion.svg",content:"Open floor while worksheets stay open if people want — neighbourly talk, not a lecture. Surplus already on hand, where people buy or trade, keeping food affordable while valuing growers' labour, and fair community prices. Printouts/QR stay available. Practical and plain — share what you know, no jargon."},{id:"takehome",label:"Take-Home",icon:"🎁",image:"placeholders/ws03-takehome.svg",content:`Every participant leaves with a physical take-home: completed cost-benefit and pricing worksheets, surplus management plan template, preservation quick-start card, and a Certificate of Completion. Redo steps on the printout / QR.

",icon:"📋",image:"placeholders/ws13-knowledge.svg",content:"Talk while people fill the card. Do not open a hive in this room without a veil, a suit, and gloves, and only a fully geared, experienced beekeeper does it. Otherwise use a model or a video. Smoker stays cold unless a mentor is teaching. Nova Scotia Bee Industry Act: anyone keeping honey bees registers with the Department of Agriculture, even one colony, within 10 days of getting them. Certificate ends 31 December. Re-register by 1 November. Email beekeeping@novascotia.ca. The Nova Scotia Beekeepers Association says registration is free; association membership is separate and paid. Bees or used equipment from outside Nova Scotia need an import permit — do not order first. No permit to move bees from mainland Nova Scotia to Cape Breton, but varroa is a real concern; ask about island stock. Used gear sold inside NS needs a provincial inspection before the sale. A swarm: stay back and call a beekeeper. Mentors: nsbeekeepers.ca/mentors. First-year harvest is often none. Leave winter stores. No kit price is printed here — get quotes."},{id:"activity",label:"Hands-On Activity",icon:"🐝",image:"placeholders/ws13-activity.svg",content:`Do the seven steps in order. Full gear or no live hive. No bees ordered. No kit price.

🧰 Materials needed (session):
• Observation hive, model, or video + projector/smartboard
• Veil/suit and gloves for demo (facilitator)
• Honey tasting samples & spoons; water for palate
• Startup cost breakdown worksheet; seasonal calendar; site sketch paper
• Safety & hive-site quick card; QR card for phone follow-along

🧰 Take-home kit (physical — what leaves with you):
• Cost sheet + seasonal calendar + safety & hive-site quick card
• Certificate of Completion

💵 Rough cost (CAD, Cape Breton/local — confirm locally):
• Session packet/tasting: low / included with MSGAM materials when provided
• Hive, bees, and gear: get written quotes. No starter price is printed here. Do not buy bees until you are registered, mentored, and allowed to receive them

🏠 At-home redo guide:
1. Lay out the veil, suit, and gloves. Name each piece. No one handles a frame without them.
2. Watch the model or the video. Do not pass a live frame around the room.
3. If a live demo was planned, only a fully geared, experienced beekeeper opens it. Cancel live bees if anyone may be allergic, the weather is wrong, or the colony is upset.
4. On the card write: register with NS Department of Agriculture, within 10 days of getting bees, renew by 1 November, certificate ends 31 December, email beekeeping@novascotia.ca. Do not submit another person's form. NSBA says registration is free; the association membership is separate.
5. Sketch a site: morning sun, wind break, water, flight path off doors and play, neighbour line.
6. Write: no bees ordered until you are registered, you have a mentor, and import rules are checked. Bees or used gear from outside Nova Scotia need a permit. Mainland to Cape Breton does not, but ask about varroa and island stock.
7. Taste honey that is already sealed. Wash hands. Leave the smoker unlit unless a mentor is teaching you.`},{id:"discussion",label:"Community Discussion",icon:"💬",image:"placeholders/ws13-discussion.svg",content:"Who nearby is already registered. What a supplier quoted — not a number from this class. Where a hive could sit without crossing doors, play, or pets. Ask the neighbour, landlord, or band first. Do not offer to catch a swarm. Mentor list is nsbeekeepers.ca/mentors."},{id:"takehome",label:"Take-Home",icon:"🎁",image:"placeholders/ws13-takehome.svg",content:`Every participant leaves with a physical kit:
