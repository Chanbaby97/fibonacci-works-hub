Book through MSGAM","Skills stay in this community","Scan QR / stay community warm"]}]},$i=[{name:"Food Sovereignty & Gardening",color:"#4a7c3f",accent:"#7ab648",dark:"#2d4a25",range:"01 – 05"},{name:"Trades",color:"#3f5f7c",accent:"#6f9fc4",dark:"#25364a",range:"06 – 08"},{name:"Business & Digital",color:"#1f6e6a",accent:"#34b3a8",dark:"#143f3c",range:"09 – 11"},{name:"Land & Stewardship",color:"#3f5a32",accent:"#7a9e3f",dark:"#243619",range:"12 – 14"}],Bl=e=>$i.find(t=>t.name===e)||$i[0],it=[{number:"01",stream:"Food Sovereignty & Gardening",title:"Introduction to Gardening",duration:"2.5 Hours",color:"#4a7c3f",accent:"#7ab648",dark:"#2d4a25",emoji:"🌱",about:"A foundational workshop covering soil health, seed selection, planting schedules, and basic growing techniques suited to Cape Breton's climate and growing season.",sections:[{id:"welcome",label:"Welcome & Opening",icon:"🤝",image:"placeholders/ws01-welcome.svg",content:"We gather on Mi'kmaq territory in Unama'ki. Open with a warm land acknowledgement (honour the territory; thank communities hosting via MSGAM — do not speak for Mi'kmaq people). Brief introductions and a clear session overview. This is hands-on-while-talking: printouts and a QR for phone follow-along sit on the table while you dig in. Preview today's physical kit — bag of soil, pots, shovel, gloves, seeds, starter trays/seedlings, seasonal calendar, soil quick card — before you get hands dirty."},{id:"knowledge",label:"The Knowledge",icon:"📋",image:"placeholders/ws01-knowledge.svg",content:"Talk through the core points while people work with soil and trays — not a lecture then a lab. Lead with spring planting: soil health, seed selection for Cape Breton, planting schedules, and growing basics (spacing, watering, sunlight). Cover frost dates / short season / wind, with only a short later-in-the-year fall care card for winterizing. Keep each point plain and practical. Point to printouts and the QR so people can follow on their phone while their hands stay busy."},{id:"activity",label:"Hands-On Activity",icon:"🪴",image:"placeholders/ws01-activity.svg",content:`• Facilitator talks while you plant — hands stay busy
• Plant into pots / starter trays; soil feel-test
• Use printouts + QR on your phone
• Receive your seasonal planting chart handout
• Ask questions while your hands are in the soil

🧰 Materials needed (session):
• Bag of soil / potting mix
• Pots and starter trays (cell packs or small pots)
• Small shovel / trowel; gloves
• Seeds or young seedlings suited to Cape Breton
• Soil samples (sand / clay / loam) for feel test
• Watering can or spray bottle; labels & marker
• Printed seasonal planting calendar + soil quick card
• QR card for phone follow-along

🧰 Take-home kit (physical — what leaves with you):
• Bag of soil · pots · shovel · gloves · seeds
• Seedlings / starter tray · seasonal calendar · soil quick card · Certificate of Completion

💵 Rough cost (CAD, Cape Breton/local — estimate — confirm locally):
• Session materials per person: about $20–45 (included in MSGAM session materials when booked)
• At-home DIY redo of one kit: about $25–50 (soil bag $8–15, pots $5–12, shovel $5–10, gloves $3–8, seeds $3–10)

🏠 At-home redo guide:
1. Fill pots/tray cells with moist mix — don't pack rock-hard.
2. Sow seeds at packet depth (or transplant seedlings gently). Wear gloves; use your shovel/trowel.
3. Label variety + date; place in bright light; keep evenly moist.
4. Use your Cape Breton planting calendar for indoor start vs outdoor plant-out.
5. Harden off before planting out after frost risk passes.`},{id:"discussion",label:"Community Discussion",icon:"💬",image:"placeholders/ws01-discussion.svg",content:`Open floor for community-specific questions:
• What have you tried to grow before?
• What grows well in your yard or community?
• What challenges have you faced?
• How can we connect growing to our food security as a community?
• Where do you buy trays, mix, and seeds locally — and what's a fair price?
• Could neighbours share bulk soil mix or start trays together?`},{id:"takehome",label:"Take-Home",icon:"🎁",image:"placeholders/ws01-takehome.svg",content:`Every participant leaves with a physical kit:
✓ Bag of soil · pots · shovel · gloves · seeds
✓ Seedlings / starter tray planted today
✓ Seasonal planting calendar for Cape Breton
✓ Soil health quick reference card
✓ Certificate of Completion

🏠 At-home redo (after class):
1. Use your soil bag, pots, shovel, and gloves to start a second tray the same way.
2. Water when the top feels dry; don't let trays sit in standing water.
3. Track frost dates on your calendar before moving plants outside.
4. Later in the year: use the short fall winterizing card; spring care stays the focus.
5. Share surplus seedlings with neighbours if you have extras.`},{id:"next",label:"What's Next",icon:"➡️",image:"placeholders/ws01-next.svg",content:`Ready to go further? The next workshop in the series:
